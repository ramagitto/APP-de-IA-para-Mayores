# Textos del alta y de las palabras reservadas para el piloto web. Los edita el rol de contenidos.
#
# BORRADOR: antes del piloto los revisa alguien con formación legal (Ley 25.326).
# Si se cambia el texto del pedido de consentimiento, hay que subir la versión: queda guardada
# junto con cada consentimiento, para saber qué aceptó cada persona.
#
# En la web la persona no escribe palabras clave: toca botones. El pedido tiene que nombrarlos
# tal como se ven en la pantalla: «Acepto», «No, gracias», «Pedir ayuda» y «Dejar el curso».
# La app muestra cada párrafo por separado.
version: web-v2-borrador
revision: borrador

pedido: >-
  Charlá es un curso para aprender a usar la inteligencia artificial en el día a día, con
  lecciones de unos 3 minutos.

  Vamos a guardar tu avance en el curso. No te pedimos tu nombre ni tu teléfono. Para corregir
  tus prácticas usamos servicios de inteligencia artificial de otras empresas, fuera de
  Argentina. Tus audios se pasan a texto y se borran enseguida.

  Este link es solo tuyo: no lo compartas. Charlá nunca te va a pedir claves, códigos ni datos de
  tu cuenta.

  Cuando quieras, en el menú vas a encontrar «Pedir ayuda», para hablar con una persona, y
  «Dejar el curso», para borrar todos tus datos.

  Si estás de acuerdo, tocá «Acepto». Si no, tocá «No, gracias».

recordatorio: >-
  Para empezar necesito tu permiso. Tocá «Acepto» para seguir, o «No, gracias» si preferís no
  hacerlo.

bienvenida: >-
  ¡Gracias! Ya está todo listo. Cada día de semana te espera una lección nueva, de unos 3
  minutos.

rechazo: >-
  Entendido. No guardamos tus datos. Si algún día querés probar, volvé a abrir este link.

baja: >-
  Listo. Borramos todos tus datos y este link deja de funcionar. Gracias por haber sido parte de
  Charlá.

ayuda: >-
  Listo, le avisamos a una persona del equipo para que te escriba por WhatsApp. Mientras tanto,
  acordate: Charlá nunca te pide claves ni códigos.
