# Líneas de ayuda públicas que aparecen en los mensajes de cuidado.
# No son datos personales: son servicios públicos.
#
# Antes del piloto hay que reverificar cada número en su fuente y actualizar la fecha
# (ver docs/checklist-piloto.md). `npm run lessons:check` avisa si pasaron más de 90 días.
